# Perfil local: mismas claves que application.properties; sobreescribí solo lo necesario.
server.address=0.0.0.0
server.port=9090
spring.application.name=guadalupe

spring.data.mongodb.uri=mongodb://localhost:27017/portfolio
spring.data.mongodb.socket-timeout=30000
spring.data.mongodb.connect-timeout=10000
spring.data.mongodb.server-selection-timeout=30000
spring.data.mongodb.max-wait-time=120000

app.base-url=http://localhost:9090


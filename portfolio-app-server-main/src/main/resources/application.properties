server.address=0.0.0.0
server.port=${PORT:9090}
spring.application.name=guadalupe

# --- MongoDB: el último segmento de la URI es el nombre de la base (ej. portfolio en local). ---
spring.data.mongodb.uri=mongodb://localhost:27017/portfolio
spring.data.mongodb.socket-timeout=30000
spring.data.mongodb.connect-timeout=10000
spring.data.mongodb.server-selection-timeout=30000
spring.data.mongodb.max-wait-time=120000

# --- App metadata & public URL (emails, health check, futuros enlaces) ---
app.display-name=${APP_DISPLAY_NAME:Guadalupe Manquillan — Portfolio API}
app.base-url=${APP_BASE_URL:http://localhost:9090}

# CORS: orígenes del front autorizados (lista separada por comas). Incluye puertos alternos de Vite (5174+) si 5173 está ocupado.
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:5176,http://127.0.0.1:5176,https://guadalupe-manquillan-portfolio.vercel.app

# --- Resend (correo transaccional). En producción definí RESEND_* en el entorno. ---
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:Acme <onboarding@resend.dev>}
resend.to.email=${RESEND_TO_EMAIL:trabajoguada@gmail.com}